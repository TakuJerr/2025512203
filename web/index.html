<!DOCTYPE html>
<html>
<head>
    <title>Personal Profile Application</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <div class="form-header">
            <h1>Personal Profile</h1>
            <p>Create Your Student Profile</p>
        </div>

        <form action="ProfileServlet" method="POST">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name"
                       placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Student ID</label>
                <input type="text" name="studentId"
                       placeholder="Enter your student ID" required>
            </div>

            <div class="form-group">
                <label>Program</label>
                <select name="program" required>
                    <option value="">Select your program</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Information Technology">Information Technology</option>
                    <option value="Information Systems">Information Systems</option>
                    <option value="Information Management">Information Management</option>
                </select>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email"
                       placeholder="Enter your email address" required>
            </div>

            <div class="form-group">
                <label>Hobbies</label>

                <div class="hobby-options">

                    <label>
                        <input type="checkbox" name="hobbies" value="Gaming">
                        Gaming
                    </label>

                    <label>
                        <input type="checkbox" name="hobbies" value="Reading">
                        Reading
                    </label>

                    <label>
                        <input type="checkbox" name="hobbies" value="Music">
                        Music
                    </label>

                    <label>
                        <input type="checkbox" name="hobbies" value="Sports">
                        Sports
                    </label>

                    <label>
                        <input type="checkbox" name="hobbies" value="Travelling">
                        Travelling
                    </label>

                </div>
            </div>

            <div class="form-group">
                <label>Short Self-Introduction</label>
                <textarea name="introduction" rows="5"
                          placeholder="Tell us something about yourself..."
                          required></textarea>
            </div>

            <button type="submit">Submit Profile</button>

        </form>

    </div>

</body>
</html>
